[package]
name = "{{APP_NAME}}"
version = "{{VERSION}}"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "Windows desktop app generated by AppHost"
license = "MIT"
repository = "https://github.com/SeanShaffer88/AppHost"

# The library target has a stable internal name so src/main.rs and the
# integration tests do not need to know the generated package's crate
# identifier. All application wiring lives here; the binary is thin.
[lib]
name = "app_skeleton"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "{{APP_NAME}}"
path = "src/main.rs"

# AppHost pins every kit to the exact revision tested with this
# template. ProcessKit and JobKit use their v0.1.0 tag targets; the
# older kits had no tags when this template was made, so their current
# main revisions are pinned as full commit SHAs. See the AppHost README
# for the bump procedure.
[dependencies]
settings_kit = { package = "settings-kit", git = "https://github.com/SeanShaffer88/SettingsKit", rev = "8430800f252eaa0ee28fe35d846b87da6e39825f" }
log_kit = { package = "log-kit", git = "https://github.com/SeanShaffer88/LogKit", rev = "305ffbc732b615f2708541566816b526200571a8" }
crashkit = { package = "crash-kit", git = "https://github.com/SeanShaffer88/CrashKit", rev = "0ab8e1533b0d7eb09fccbb913a77f779d5c7899e" }
updatekit = { git = "https://github.com/SeanShaffer88/UpdateKit", rev = "7b193e093e0efe8f2ef721cbc23adbf16f8d5fd2" }
process_kit = { package = "process-kit", git = "https://github.com/SeanShaffer88/ProcessKit", rev = "01ea9b136ecec55f09129300d18d1edcd9d09a6e" }
job_kit = { package = "job-kit", git = "https://github.com/SeanShaffer88/JobKit", rev = "1d9fd334f1573aa64d53b8a660a0c19dde33e524" }
